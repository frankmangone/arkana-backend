services:
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: arkana-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
    volumes:
      - meili-data:/meili_data

volumes:
  meili-data:
