{{define "content"}}
<p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#e1dfe4;text-align:center;">
  New post available: <strong style="color:#f8f5ff;">{{.PostTitle}}</strong>
</p>
<p style="text-align:center;margin:0 0 24px;">
  <a href="{{.PostURL}}" style="display:inline-block;padding:12px 24px;background-color:#6423e7;color:#f8f5ff;text-decoration:none;border-radius:6px;font-size:16px;">Read it</a>
</p>
<p style="margin:24px 0 0;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aca6bd;text-align:center;">
  <a href="{{.UnsubscribeLink}}" style="color:#aca6bd;">Unsubscribe</a>
</p>
{{end}}
